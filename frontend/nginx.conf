server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # config.js is regenerated per-container-start; never let browsers/CDNs cache it.
    location = /config.js {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # Client-side routing (react-router-dom) fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
